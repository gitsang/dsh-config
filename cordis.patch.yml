# Harness-home user patch layer.
#
# This layer outranks every profile's own cordis.patch.yml, so the model
# gateway is declared once here and every profile (web, daemon, tui, headless
# and any profile created later) inherits it. Per-profile model overrides do
# not work: this layer always wins, so change the selection here.
#
# Keep this file to rows that EVERY profile mounts (llm-pi-ai,
# agent-default-model). A row named here but absent from a given profile fails
# that layer with `entry "<id>" not found`, so surface-specific rows (theme,
# onboarding, presets) belong in that profile's own patch.

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      saigw:
        displayName: SaiGW
        apiKeyEnv: SAIGW_API_KEY
        api: openai-completions
        baseURL: https://aigw.cn.c8g.top/v1
        models:
          - id: deepseek-flash
            name: Deepseek Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              thinkingFormat: deepseek
      saigw-openai:
        displayName: SaiGW (Responses)
        apiKeyEnv: SAIGW_API_KEY
        api: openai-responses
        baseURL: https://aigw.cn.c8g.top/v1
        models:
          - id: gpt-6.1-sol
            name: GPT 6.1 Sol
            contextWindow: 400000
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
      saigw-anthropic:
        displayName: SaiGW (Anthropic)
        apiKeyEnv: SAIGW_API_KEY
        api: anthropic-messages
        baseURL: https://aigw.cn.c8g.top/anthropic
        models:
          - id: claude-opus
            name: Claude Opus
            contextWindow: 1048576
            maxTokens: 128000
            input:
              - text
              - image
            reasoningEfforts:
              minimal: low
              low: low
              medium: medium
              high: high

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: saigw
    model: deepseek-flash
