# Harness-home user patch layer.
#
# This layer outranks every profile's own cordis.patch.yml, so the model
# gateway is declared once here and every profile (web, daemon, tui, headless
# and any profile created later) inherits it.
#
# Why this file exists: dsh removed the global `settings.yaml` document. Starting
# with 0.2.0-rc.2, `dsh-settings` imports `settings.yaml` into the *active
# profile's* cordis.patch.yml and renames the file to `settings.yaml.imported`,
# so the provider routes that used to live there disappeared from every profile
# that was not explicitly rewritten — leaving `llm-pi-ai` with no routes and the
# default model pointing at a route that has no key (MISSING_CREDENTIAL).
#
# Overriding the default model per profile is no longer possible: this layer
# always wins. Change the selection here.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      saigw:
        displayName: SaiGW
        apiKeyEnv: SAIGW_API_KEY
        api: openai-completions
        baseURL: https://aigw.cn.c8g.top/v1
        models:
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              thinkingFormat: deepseek
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              thinkingFormat: deepseek
          - id: glm-5.2
            name: GLM 5.2
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
            reasoningEfforts:
              high: high
              max: max
            compat:
              thinkingFormat: zai
              supportsReasoningEffort: true
          - id: grok-4.5
            name: Grok 4.5
            contextWindow: 500000
            maxTokens: 500000
            input:
              - text
              - image
            reasoningEfforts:
