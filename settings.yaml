ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

llm-pi-ai:
  providers:
    saigw:
      displayName: SaiGW
      apiKeyEnv: SAIGW_API_KEY
      api: openai-completions
      baseURL: https://aigw.cn.c8g.top/v1
      models:
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
          contextWindow: 1000000
          maxTokens: 384000
          input: [ text ]
          reasoningEfforts:
            low: low
            high: high
            max: max
          compat:
            thinkingFormat: deepseek
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
          contextWindow: 1000000
          maxTokens: 384000
          input: [ text ]
          reasoningEfforts:
            low: low
            high: high
            max: max
          compat:
            thinkingFormat: deepseek
        - id: glm-5.2
          name: GLM 5.2
          contextWindow: 1000000
          maxTokens: 131072
          input: [ text ]
          reasoningEfforts:
            high: high
            max: max
          compat:
            thinkingFormat: zai
            supportsReasoningEffort: true
        - id: grok-4.5
          name: Grok 4.5
          contextWindow: 500000
          maxTokens: 500000
